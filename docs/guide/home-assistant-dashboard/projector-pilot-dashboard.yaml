# Projector Pilot - Home Assistant dashboard
#
# Paste this into a new dashboard's Raw configuration editor.
# Replace two strings everywhere they appear:
#   YOUR_PROJECTOR -> your projector sensor, e.g. projector_pilot_epson_qb1000b_qb1000w
#   YOURSERIAL     -> the serial-derived id from the app's Home Assistant screen
# and the three scene ids (YOURSCENE1..3) from the app's synced Scene cards.
#
# Needs from HACS: Mushroom, button-card, card-mod, mini-graph-card.
# Info tiles are live at once; control and Scene buttons work after you paste
# the app's Copy block into configuration.yaml, restart, and tap Sync.

title: Projector Pilot
views:
- title: Projector Pilot
  path: projector-pilot
  icon: mdi:projector
  cards:
  - type: markdown
    content: '&#127909;  &nbsp; **PROJECTOR PILOT**'
    card_mod:
      style: 'ha-card { background: linear-gradient(135deg, rgba(61,220,107,0.30), rgba(16,120,60,0.30)); border: 1px solid
        rgba(61,220,107,0.45); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); } ha-markdown { padding: 12px
        20px !important; } ha-markdown p { margin: 0 !important; letter-spacing: 3px; color: #eafff0; font-size: 14px; font-weight:
        700; }'
  - type: custom:button-card
    entity: sensor.YOUR_PROJECTOR
    name: Epson QB1000
    show_state: true
    show_label: true
    size: 48px
    state_display: '[[[ return entity.state==''on'' ? ''Powered on'' : ''Standby''; ]]]'
    label: '[[[ var a=entity.attributes; return (a.input||''-'')+''  •  ''+(a.color_mode||''-'')+''  •  ''+(a.video_range||''-'')+''  •  ''+(a.lamp_hours||0)+''
      h  •  ''+(a.operation_light_output||0)+''% light''; ]]]'
    styles:
      card:
      - height: 176px
      - background: linear-gradient(135deg, rgba(61,220,107,0.32), rgba(11,64,34,0.6))
      - border: 1px solid rgba(61,220,107,0.5)
      - border-radius: 22px
      - box-shadow: 0 12px 36px rgba(0,0,0,0.42)
      - padding: 20px
      grid:
      - grid-template-areas: '"i n" "i s" "i l"'
      - grid-template-columns: 104px 1fr
      - grid-template-rows: 1fr min-content min-content
      img_cell:
      - justify-self: center
      - align-self: center
      icon:
      - color: '#3ddc6b'
      - width: 68px
      name:
      - justify-self: start
      - font-size: 28px
      - font-weight: '800'
      - color: '#f2fff6'
      state:
      - justify-self: start
      - font-size: 17px
      - color: '[[[ return entity.state==''on'' ? ''#3ddc6b'' : ''#8a9'' ]]]'
      label:
      - justify-self: start
      - font-size: 12.5px
      - color: '#bcd6c6'
      - padding-top: 8px
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
    - type: template
      icon: mdi:projector
      content: '{{ ''On'' if states(''sensor.YOUR_PROJECTOR'')==''on'' else ''Standby'' }}'
      icon_color: '{{ ''green'' if states(''sensor.YOUR_PROJECTOR'')==''on'' else ''grey'' }}'
    - type: template
      icon: mdi:hdmi-port
      content: '{{ state_attr(''sensor.YOUR_PROJECTOR'',''input'') }}'
      icon_color: green
    - type: template
      icon: mdi:palette
      content: '{{ state_attr(''sensor.YOUR_PROJECTOR'',''color_mode'') }}'
      icon_color: green
    - type: template
      icon: mdi:high-definition
      content: '{{ state_attr(''sensor.YOUR_PROJECTOR'',''video_range'') }}'
      icon_color: green
    - type: template
      icon: mdi:lightbulb-on
      content: '{{ state_attr(''sensor.YOUR_PROJECTOR'',''lamp_hours'') }} h'
      icon_color: green
    - type: template
      icon: mdi:check-network
      content: Linked
      icon_color: green
  - type: markdown
    content: '&#128268;  &nbsp; **POWER &amp; SOURCE**'
    card_mod:
      style: 'ha-card { background: linear-gradient(135deg, rgba(61,220,107,0.30), rgba(16,120,60,0.30)); border: 1px solid
        rgba(61,220,107,0.45); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); } ha-markdown { padding: 12px
        20px !important; } ha-markdown p { margin: 0 !important; letter-spacing: 3px; color: #eafff0; font-size: 14px; font-weight:
        700; }'
